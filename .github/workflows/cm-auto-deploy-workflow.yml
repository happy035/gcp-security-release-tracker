name: Code Mender Security Scan, Auto-Merge, Re-Scan & Cloud Run Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  security-events: write
  id-token: write # Required for Workload Identity Federation (GCP OIDC auth)

env:
  # GCS 버킷 및 경로 설정 (GitHub Repository Variables 또는 Secrets: GCS_BUCKET_NAME)
  GCS_BUCKET: ${{ vars.GCS_BUCKET_NAME || secrets.GCS_BUCKET_NAME }}
  GCS_CONFIG_DIR: ${{ vars.GCS_CONFIG_DIR || secrets.GCS_CONFIG_DIR }}
  CLOUD_RUN_SERVICE: gcp-security-release-tracker
  CLOUD_RUN_REGION: asia-northeast3
  DEFAULT_GCP_PROJECT: security-demo-319501

jobs:
  codemender-analysis:
    name: Code Mender Scan, Fix, Auto-Merge & Re-Verify main
    runs-on: ubuntu-latest
    outputs:
      post_merge_vuln_count: ${{ steps.rescan_main.outputs.post_merge_vuln_count || steps.cm_verify_and_fix.outputs.unfixed_count || '0' }}
      deploy_ready: ${{ steps.rescan_main.outputs.deploy_ready || 'false' }}
      merged_branches: ${{ steps.auto_merge.outputs.merged_branches || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # ----------------------------------------------------------------------
      # 0. Python 실행 환경 및 의존성 설정
      # ----------------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies & Verify Syntax
        run: |
          echo "=== Installing Python Dependencies ==="
          python3 -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          echo "=== Compiling & Verifying Python Source Files ==="
          python3 -m py_compile cli.py
          python3 -m py_compile src/*.py

      # ----------------------------------------------------------------------
      # 1. Google Cloud 인증 및 Cloud SDK 설정
      # ----------------------------------------------------------------------
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          # 방법 1: Workload Identity Federation (권장)
          # workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          # service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

          # 방법 2: Service Account Key JSON
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          create_credentials_file: false
          export_environment_variables: false

      - name: Configure Application Default Credentials (ADC)
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          mkdir -p ~/.config/gcloud
          echo "$GCP_SA_KEY" > /tmp/gcp_credentials.json
          echo "$GCP_SA_KEY" > ~/.config/gcloud/application_default_credentials.json
          chmod 600 /tmp/gcp_credentials.json ~/.config/gcloud/application_default_credentials.json

          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp_credentials.json" >> $GITHUB_ENV

          # gcloud CLI에서 해당 Service Account 활성화
          gcloud auth activate-service-account --key-file=/tmp/gcp_credentials.json

          # Project ID 추출 및 환경설정
          PROJECT_ID=$(python3 -c 'import json, os; print(json.loads(os.environ.get("GCP_SA_KEY", "{}")).get("project_id", ""))')
          if [ -n "$PROJECT_ID" ]; then
            echo "CLOUDSDK_CORE_PROJECT=$PROJECT_ID" >> $GITHUB_ENV
            echo "GOOGLE_CLOUD_PROJECT=$PROJECT_ID" >> $GITHUB_ENV
            gcloud config set project "$PROJECT_ID" || true
          fi

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      # ----------------------------------------------------------------------
      # 2. Google Artifact Registry에서 최신 Code Mender CLI (cm) 다운로드 및 설치
      # ----------------------------------------------------------------------
      - name: Download & Install Code Mender CLI from Artifact Registry
        run: |
          echo "=== Fetching GCP Access Token for Artifact Registry ==="
          ACCESS_TOKEN=$(gcloud auth print-access-token)

          # OS 및 아키텍처 자동 감지 (Linux amd64 / macOS arm64 지원)
          OS_NAME=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH_NAME=$(uname -m)
          case $ARCH_NAME in
            x86_64) ARCH="amd64" ;;
            aarch64|arm64) ARCH="arm64" ;;
            *) ARCH="amd64" ;;
          esac

          ZIP_FILE="cm-${OS_NAME}-${ARCH}.zip"
          ENCODED_TARGET="cm%3Astable%3A${ZIP_FILE}"
          DOWNLOAD_URL="https://artifactregistry.googleapis.com/download/v1/projects/cmoc-prod/locations/us/repositories/codemender-cli-production/files/${ENCODED_TARGET}:download?alt=media"

          echo "=== Downloading Code Mender package: ${ZIP_FILE} ==="
          mkdir -p /tmp/cm-install
          if ! curl -fsSL -H "Authorization: Bearer ${ACCESS_TOKEN}" -o "/tmp/cm-install/${ZIP_FILE}" "${DOWNLOAD_URL}"; then
            echo "[ERROR] Failed to download Code Mender CLI from Artifact Registry. Check IAM permissions for Artifact Registry Reader." >&2
            exit 1
          fi

          echo "=== Extracting and installing cm binary ==="
          unzip -o "/tmp/cm-install/${ZIP_FILE}" -d /tmp/cm-install/extracted/

          # 압축 해제된 디렉토리 내 cm 바이너리 탐색 및 설치
          CM_BIN=$(find /tmp/cm-install/extracted/ -type f -name "cm" | head -n 1)
          if [ -z "$CM_BIN" ]; then
            echo "[ERROR] 'cm' executable not found in unzipped package." >&2
            exit 1
          fi

          chmod +x "$CM_BIN"
          sudo mv "$CM_BIN" /usr/local/bin/cm

          echo "=== Verifying Code Mender installation ==="
          cm --version || cm -v

      # ----------------------------------------------------------------------
      # 3. Code Mender 초기화 (cm init) 및 GCS 환경설정(config.yaml) 동기화
      # ----------------------------------------------------------------------
      - name: Initialize Code Mender & Restore Config from GCS
        run: |
          echo "=== Initializing Code Mender environment ==="
          mkdir -p ~/.codemender

          RAW_BUCKET="${GCS_BUCKET:-}"
          CLEAN_BUCKET=$(echo "$RAW_BUCKET" | sed -e 's|^gs://||' -e 's|/*$||')
          GCS_TARGET_DIR="${GCS_CONFIG_DIR:-codemender-config}"

          if [ -n "$CLEAN_BUCKET" ] && [ "$CLEAN_BUCKET" != "true" ] && [ "$CLEAN_BUCKET" != "false" ]; then
            echo "=== Restoring config.yaml from GCS (gs://${CLEAN_BUCKET}/${GCS_TARGET_DIR}) ==="
            if gcloud storage ls "gs://${CLEAN_BUCKET}/${GCS_TARGET_DIR}/config.yaml" 2>/dev/null; then
              echo "[INFO] Restoring remote config.yaml from GCS..."
              gcloud storage cp "gs://${CLEAN_BUCKET}/${GCS_TARGET_DIR}/config.yaml" ~/.codemender/config.yaml || true
            elif gcloud storage ls "gs://${CLEAN_BUCKET}/config.yaml" 2>/dev/null; then
              gcloud storage cp "gs://${CLEAN_BUCKET}/config.yaml" ~/.codemender/config.yaml || true
            fi
          else
            echo "[INFO] GCS_BUCKET_NAME not configured or invalid ('$GCS_BUCKET'). Skipping GCS config restore."
          fi

          # 이전 실행의 만료된 세션/삭제된 파일 참조로 인한 Precondition check failed (HTTP 400) 방지를 위해
          # state.db는 매 실행 시 깨끗한 상태로 초기화
          rm -f ~/.codemender/state.db
          cm init
          cm init --verify

      # ----------------------------------------------------------------------
      # 3.5 변경된 소스코드 파일 탐지 (증분 스캔)
      # ----------------------------------------------------------------------
      - name: Detect Changed Source Files (Incremental Scan)
        id: detect_changes
        run: |
          echo "=== Detecting Changed Files in this Push/PR ==="

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED_FILES=$(git diff --name-only --diff-filter=d origin/${{ github.base_ref }}...HEAD)
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            CHANGED_FILES=$(git diff --name-only --diff-filter=d ${{ github.event.before }} ${{ github.sha }})
          else
            CHANGED_FILES=$(git diff --name-only --diff-filter=d HEAD~1 HEAD 2>/dev/null || git ls-files)
          fi

          echo "All modified files:"
          echo "$CHANGED_FILES"

          # 소스 코드 확장자 필터링 (실행 코드 및 템플릿 파일 중심; 정적 데이터 JSON 제외)
          TARGET_FILES=""
          for f in $CHANGED_FILES; do
            if [ -f "$f" ]; then
              case "$f" in
                .github/*|config/*.json|*.md)
                  continue
                  ;;
                *.py|*.html|Dockerfile|requirements.txt)
                  TARGET_FILES="$TARGET_FILES $f"
                  ;;
              esac
            fi
          done

          # 수동 실행(workflow_dispatch) 시 변경 파일이 없으면 src 디렉토리 스캔
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -z "$TARGET_FILES" ]; then
            echo "Workflow manually dispatched. Scanning src/ and cli.py."
            TARGET_FILES="cli.py src"
          fi

          if [ -z "$TARGET_FILES" ]; then
            echo "[INFO] No source code files modified in this push. Skipping Code Mender scan."
            echo "skip_scan=true" >> $GITHUB_OUTPUT
            echo "targets=" >> $GITHUB_OUTPUT
          else
            echo "[INFO] Target source files to scan: $TARGET_FILES"
            echo "skip_scan=false" >> $GITHUB_OUTPUT
            echo "targets=$TARGET_FILES" >> $GITHUB_OUTPUT
          fi

      # ----------------------------------------------------------------------
      # 4. Code Mender CLI 최신 버전 업데이트 (cm update - 항상 먼저 실행)
      # ----------------------------------------------------------------------
      - name: Update Code Mender CLI to Latest Version
        id: cm_update
        if: steps.detect_changes.outputs.skip_scan != 'true'
        run: |
          echo "=== 4. Updating Code Mender CLI (cm update) ==="
          sudo cm update || cm update || true
          echo "=== Current Code Mender CLI Version ==="
          cm --version || cm -v

      # ----------------------------------------------------------------------
      # 5. 1차 소스코드 취약점 스캔 (cm find - 증분 스캔 및 세션 오류 복구)
      # ----------------------------------------------------------------------
      - name: Run Initial Code Mender Scan (find)
        id: cm_scan
        if: steps.detect_changes.outputs.skip_scan != 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp_credentials.json
          TARGETS: ${{ steps.detect_changes.outputs.targets }}
        run: |
          echo "=== 5. Running Initial Code Mender Scan on modified targets ==="
          for target in $TARGETS; do
            echo "--> Scanning target: $target"
            if ! cm find "$target" -y --sandbox=false --bypass-warning; then
              echo "[WARN] 'cm find $target' encountered a backend session error (e.g. SubmitToolResult 400 Precondition check failed). Retrying once with fresh session..."
              sleep 5
              cm find "$target" -y --sandbox=false --bypass-warning || echo "[WARN] Second attempt on '$target' exited non-zero; proceeding with recorded findings in state.db."
            fi
          done

      # ----------------------------------------------------------------------
      # 6. 취약점 검증 (cm verify) 및 자동 패치 브랜치/PR 생성 (cm fix)
      # ----------------------------------------------------------------------
      - name: Verify Findings & Create Fix Branches (Pre-PR stage)
        id: cm_verify_and_fix
        if: steps.detect_changes.outputs.skip_scan != 'true'
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp_credentials.json
        run: |
          python3 - << 'EOF'
          import json
          import os
          import subprocess
          import sys
          import time

          def run_cm_with_retry(cmd, max_attempts=2):
              for attempt in range(1, max_attempts + 1):
                  proc = subprocess.run(cmd, capture_output=True, text=True)
                  combined = (proc.stdout or "") + "\n" + (proc.stderr or "")
                  if proc.returncode == 0:
                      return proc
                  if "Precondition check failed" in combined or "SubmitToolResult failed" in combined:
                      print(f"[WARN] Backend session precondition error on attempt {attempt}/{max_attempts} for {' '.join(cmd)}. Retrying...")
                      time.sleep(5)
                      continue
                  return proc
              return proc

          print("=== 6. Retrieving Initial Findings Report ===")
          report_proc = subprocess.run(["cm", "report", "-f", "json"], capture_output=True, text=True)
          if report_proc.returncode != 0:
              print(f"[ERROR] cm report failed (exit {report_proc.returncode}):\n{report_proc.stderr}", file=sys.stderr)
              sys.exit(1)
          try:
              findings = json.loads(report_proc.stdout) if report_proc.stdout.strip() else []
          except json.JSONDecodeError as e:
              print(f"[ERROR] Failed to parse findings report as JSON: {e}", file=sys.stderr)
              print(f"Raw output: {report_proc.stdout[:500]}", file=sys.stderr)
              sys.exit(1)

          print(f"Total findings in report: {len(findings)}")

          base_commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          repo_name = os.environ.get("GITHUB_REPOSITORY", "")
          github_output = os.environ.get("GITHUB_OUTPUT", "")

          verified_count = 0
          unfixed_count = 0
          fixed_branches = []

          for idx, finding in enumerate(findings, 1):
              finding_id = finding.get("finding_id") or finding.get("FindingID") or finding.get("id")
              title = finding.get("title") or finding.get("Title", "Security Vulnerability")
              severity = (finding.get("severity") or finding.get("Severity", "UNKNOWN")).upper()
              status = (finding.get("status") or finding.get("Status", "OPEN")).upper()

              if not finding_id or status == "FIXED":
                  continue

              print(f"\n[{idx}/{len(findings)}] Processing Finding: {finding_id}")
              print(f"    Title: {title}")
              print(f"    Severity: {severity} | Current Status: {status}")

              try:
                  # (1) 취약점 검증 (cm verify)
                  print(f"--> Step 1: Verifying vulnerability with 'cm verify {finding_id} -y --sandbox=false --bypass-warning'...")
                  verify_proc = run_cm_with_retry(["cm", "verify", finding_id, "-y", "--sandbox=false", "--bypass-warning"])
                  print(verify_proc.stdout)

                  if verify_proc.returncode != 0:
                      print(f"[-] Verification failed or dismissed for {finding_id}. Skipping fix.")
                      continue

                  verified_count += 1
                  print(f"[+] Finding {finding_id} successfully verified.")

                  # (2) 기준 커밋(base_commit)으로부터 Finding 전용 브랜치 생성 및 체크아웃
                  safe_id = finding_id.replace("/", "-").replace(".", "-")
                  branch_name = f"cm-fix/{safe_id}"
                  print(f"--> Step 2: Creating and checking out branch '{branch_name}' from commit '{base_commit[:8]}'...")
                  subprocess.run(["git", "checkout", "-B", branch_name, base_commit], check=True)

                  # (3) cm fix로 보안 패치 적용
                  print(f"--> Step 3: Generating and applying fix with 'cm fix {finding_id} -y --sandbox=false --bypass-warning'...")
                  fix_proc = run_cm_with_retry(["cm", "fix", finding_id, "-y", "--sandbox=false", "--bypass-warning"])
                  print(fix_proc.stdout)

                  if fix_proc.returncode != 0:
                      print(f"[-] cm fix failed for {finding_id} (exit {fix_proc.returncode}), skipping commit.", file=sys.stderr)
                      print(fix_proc.stderr, file=sys.stderr)
                      unfixed_count += 1
                      continue

                  # (4) 코드 변경사항 커밋
                  status_proc = subprocess.run(["git", "status", "--porcelain"], capture_output=True, text=True)
                  if status_proc.stdout.strip():
                      print(f"--> Step 4: Staging and committing changes on branch '{branch_name}'...")
                      subprocess.run(["git", "add", "."], check=True)
                      commit_message = f"fix(security): resolve {title}\n\nCode Mender Finding ID: {finding_id}\nSeverity: {severity}"
                      subprocess.run(["git", "commit", "-m", commit_message], check=True)

                      # (5) 원격 저장소로 브랜치 Push
                      print(f"--> Step 5: Pushing branch '{branch_name}' to origin...")
                      push_proc = subprocess.run(["git", "push", "-u", "origin", branch_name, "--force"], capture_output=True, text=True)
                      if push_proc.returncode == 0:
                          print(f"[SUCCESS] Branch '{branch_name}' successfully pushed to remote.")
                          fixed_branches.append(branch_name)

                          # (6) GitHub CLI (gh)를 통한 Pull Request 자동 생성
                          print(f"--> Step 6: Creating Pull Request for '{branch_name}' into 'main'...")
                          pr_title = f"fix(security): resolve {title} ({finding_id[:8]})"
                          pr_body = (
                              f"### 🛡️ Code Mender Security Patch\n\n"
                              f"- **Vulnerability Title**: {title}\n"
                              f"- **Finding ID**: `{finding_id}`\n"
                              f"- **Severity**: `{severity}`\n"
                              f"- **Status**: `VERIFIED & FIXED`\n\n"
                              f"#### 📝 Description\n"
                              f"This automated Pull Request was generated by [Code Mender](https://cloud.google.com) "
                              f"after finding, verifying, and testing an exploit fix against this codebase."
                          )

                          pr_check = subprocess.run(
                              ["gh", "pr", "list", "--repo", repo_name, "--head", branch_name, "--state", "open", "--json", "number,url"],
                              capture_output=True, text=True, env=os.environ
                          )
                          try:
                              existing_prs = json.loads(pr_check.stdout) if pr_check.returncode == 0 and pr_check.stdout.strip() else []
                          except Exception:
                              existing_prs = []

                          if existing_prs:
                              print(f"[INFO] Pull Request already exists: {existing_prs[0].get('url', '')}")
                          else:
                              pr_create_proc = subprocess.run(
                                  [
                                      "gh", "pr", "create",
                                      "--repo", repo_name,
                                      "--base", "main",
                                      "--head", branch_name,
                                      "--title", pr_title,
                                      "--body", pr_body
                                  ],
                                  capture_output=True, text=True, env=os.environ
                              )
                              if pr_create_proc.returncode == 0:
                                  print(f"[SUCCESS] Pull Request created successfully:\n{pr_create_proc.stdout.strip()}")
                              else:
                                  print(f"[WARN] Failed to create Pull Request: {pr_create_proc.stderr.strip()}", file=sys.stderr)
                      else:
                          print(f"[ERROR] Failed to push branch: {push_proc.stderr}", file=sys.stderr)
                          unfixed_count += 1
                  else:
                      print(f"[-] No file changes were generated by 'cm fix' for finding {finding_id}.")
                      unfixed_count += 1

              except subprocess.CalledProcessError as e:
                  print(f"[ERROR] Git command failed for finding {finding_id}: {e}", file=sys.stderr)
                  unfixed_count += 1
              finally:
                  subprocess.run(["git", "checkout", "-f", base_commit])
                  subprocess.run(["git", "clean", "-fd"])

          print(f"\n=== Initial Scan & Fix Summary ===")
          print(f"Verified vulnerabilities : {verified_count}")
          print(f"Fixed branches created   : {len(fixed_branches)} ({' '.join(fixed_branches)})")
          print(f"Unfixed vulnerabilities  : {unfixed_count}")

          if github_output:
              with open(github_output, "a", encoding="utf-8") as f:
                  f.write(f"verified_count={verified_count}\n")
                  f.write(f"unfixed_count={unfixed_count}\n")
                  f.write(f"fixed_branches={' '.join(fixed_branches)}\n")
          EOF

      # ----------------------------------------------------------------------
      # 7. 생성된 패치 PR(cm-fix/*) 또는 클린 PR을 main 브랜치에 자동 Merge
      # ----------------------------------------------------------------------
      - name: Auto-Merge Fix Branches / PR into main
        id: auto_merge
        if: steps.detect_changes.outputs.skip_scan != 'true' && steps.cm_verify_and_fix.outputs.unfixed_count == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.head_ref }}
          FIXED_BRANCHES: ${{ steps.cm_verify_and_fix.outputs.fixed_branches }}
        run: |
          echo "=== 7. Auto-Merging Patched Branches / PR into 'main' ==="
          MERGED_LIST=""
          DID_MERGE="false"

          # (1) cm fix로 생성된 보안 패치 브랜치(cm-fix/*)들을 main으로 자동 병합
          if [ -n "${FIXED_BRANCHES}" ]; then
            echo "[INFO] Auto-merging Code Mender fix branches into 'main': ${FIXED_BRANCHES}"
            git fetch origin main
            for branch in ${FIXED_BRANCHES}; do
              echo "--> Merging PR/branch '${branch}' into 'main'..."
              if gh pr merge "${branch}" --repo "${GITHUB_REPOSITORY}" --merge --delete-branch; then
                echo "[SUCCESS] Merged PR for '${branch}' via GitHub CLI."
                MERGED_LIST="${MERGED_LIST} ${branch}"
                DID_MERGE="true"
              else
                echo "[INFO] Falling back to direct git merge for '${branch}' into 'main'..."
                git fetch origin main "${branch}"
                git checkout -B main origin/main
                git merge --no-ff "origin/${branch}" -m "Merge branch '${branch}' into main (Code Mender Auto-Merge)"
                git push origin main
                MERGED_LIST="${MERGED_LIST} ${branch}"
                DID_MERGE="true"
              fi
            done
          fi

          # (2) Pull Request 이벤트로 실행되었고 미해결 취약점이 0건인 경우 해당 PR을 main으로 병합
          if [ "${EVENT_NAME}" = "pull_request" ] && [ -n "${PR_NUMBER}" ]; then
            echo "[INFO] Auto-merging PR #${PR_NUMBER} (${PR_HEAD_REF}) into 'main'..."
            if gh pr merge "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --merge --delete-branch; then
              echo "[SUCCESS] Pull Request #${PR_NUMBER} merged via GitHub CLI."
              MERGED_LIST="${MERGED_LIST} PR#${PR_NUMBER}"
              DID_MERGE="true"
            else
              echo "[INFO] Falling back to direct git merge for PR #${PR_NUMBER} (${PR_HEAD_REF})..."
              git fetch origin main "${PR_HEAD_REF}"
              git checkout -B main origin/main
              git merge --no-ff "origin/${PR_HEAD_REF}" -m "Merge pull request #${PR_NUMBER} from ${PR_HEAD_REF} (Code Mender Auto-Merge)"
              git push origin main
              MERGED_LIST="${MERGED_LIST} PR#${PR_NUMBER}"
              DID_MERGE="true"
            fi
          fi

          echo "merged_branches=${MERGED_LIST}" >> $GITHUB_OUTPUT
          echo "did_merge=${DID_MERGE}" >> $GITHUB_OUTPUT

      # ----------------------------------------------------------------------
      # 8. Merge 완료된 최신 main 브랜치 재스캔 (취약점 조치 완료 여부 = 0건 최종 검증)
      # ----------------------------------------------------------------------
      - name: Re-Scan Merged main Branch to Confirm 0 Vulnerabilities
        id: rescan_main
        if: steps.detect_changes.outputs.skip_scan == 'true' || steps.cm_verify_and_fix.outputs.unfixed_count == '0'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp_credentials.json
          SKIP_SCAN: ${{ steps.detect_changes.outputs.skip_scan }}
          TARGETS: ${{ steps.detect_changes.outputs.targets }}
          VERIFIED_COUNT: ${{ steps.cm_verify_and_fix.outputs.verified_count || '0' }}
          DID_MERGE: ${{ steps.auto_merge.outputs.did_merge || 'false' }}
        run: |
          echo "=== 8. Verifying Merged 'main' Branch Vulnerability Status ==="

          # 최신 origin/main 체크아웃 및 Python 문법 무결성 검증
          git fetch origin main
          git checkout -B main origin/main
          git reset --hard origin/main

          echo "--> Verifying Python syntax on latest merged 'main'..."
          python3 -m py_compile cli.py
          python3 -m py_compile src/*.py

          # (A) 소스 변경이 없었거나, 1차 스캔에서 이미 main 브랜치의 검증된 취약점이 0건이었고 추가 병합도 없었던 경우
          if [ "${SKIP_SCAN}" = "true" ] || { [ "${VERIFIED_COUNT}" = "0" ] && [ "${DID_MERGE}" != "true" ]; }; then
            echo "[INFO] Initial scan already confirmed 0 vulnerabilities on 'main'. No re-scan needed."
            echo "post_merge_vuln_count=0" >> $GITHUB_OUTPUT
            echo "deploy_ready=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # (B) 패치 브랜치(cm-fix/*) 또는 PR이 main에 Merge된 경우:
          #     병합된 최신 main 브랜치를 대상으로 다시 cm find 및 cm verify를 수행하여 취약점이 실제로 조치(0건)되었는지 확인
          echo "=== Running Post-Merge Code Mender Re-Scan on 'main' ==="
          rm -f ~/.codemender/state.db
          cm init

          for target in $TARGETS; do
            echo "--> Re-scanning merged 'main' target: $target"
            if ! cm find "$target" -y --sandbox=false --bypass-warning; then
              echo "[WARN] Post-merge 'cm find $target' hit session error; retrying once..."
              sleep 5
              cm find "$target" -y --sandbox=false --bypass-warning || echo "[WARN] Second attempt on '$target' exited non-zero; checking state.db findings."
            fi
          done

          python3 - << 'EOF'
          import json
          import os
          import subprocess
          import sys

          print("=== Evaluating Post-Merge Findings Report on 'main' ===")
          report_proc = subprocess.run(["cm", "report", "-f", "json"], capture_output=True, text=True)
          if report_proc.returncode != 0:
              print(f"[ERROR] Post-merge cm report failed:\n{report_proc.stderr}", file=sys.stderr)
              sys.exit(1)

          try:
              findings = json.loads(report_proc.stdout) if report_proc.stdout.strip() else []
          except json.JSONDecodeError as e:
              print(f"[ERROR] Failed to parse post-merge report JSON: {e}", file=sys.stderr)
              sys.exit(1)

          remaining_verified = 0
          for finding in findings:
              finding_id = finding.get("finding_id") or finding.get("FindingID") or finding.get("id")
              status = (finding.get("status") or finding.get("Status", "OPEN")).upper()
              if not finding_id or status == "FIXED":
                  continue

              verify_proc = subprocess.run(
                  ["cm", "verify", finding_id, "-y", "--sandbox=false", "--bypass-warning"],
                  capture_output=True, text=True
              )
              if verify_proc.returncode == 0:
                  remaining_verified += 1
                  print(f"[WARN] Vulnerability still present on merged 'main': {finding_id}", file=sys.stderr)

          print(f"=== Post-Merge Re-Scan Result on 'main': {remaining_verified} vulnerabilities ===")
          github_output = os.environ.get("GITHUB_OUTPUT", "")
          if github_output:
              with open(github_output, "a", encoding="utf-8") as f:
                  f.write(f"post_merge_vuln_count={remaining_verified}\n")
                  f.write(f"deploy_ready={'true' if remaining_verified == 0 else 'false'}\n")

          if remaining_verified > 0:
              print("[ERROR] Post-merge scan found remaining vulnerabilities on 'main'. Blocking Cloud Run deployment.", file=sys.stderr)
              sys.exit(1)
          EOF

      # ----------------------------------------------------------------------
      # 9. 실행 결과 상태 및 로그를 GCS에 백업/동기화 (러너 종료 전 상태 보존)
      # ----------------------------------------------------------------------
      - name: Backup Code Mender State & Logs to GCS
        if: always()
        run: |
          RAW_BUCKET="${GCS_BUCKET:-}"
          CLEAN_BUCKET=$(echo "$RAW_BUCKET" | sed -e 's|^gs://||' -e 's|/*$||')
          GCS_TARGET_DIR="${GCS_CONFIG_DIR:-codemender-config}"

          echo "=== 9. Code Mender State Backup ==="
          echo "Configured GCS_BUCKET: '$RAW_BUCKET'"
          echo "Cleaned Bucket Name:   '$CLEAN_BUCKET'"
          echo "Target Directory:      '$GCS_TARGET_DIR'"
          echo "GitHub Run ID:         '${{ github.run_id }}'"

          echo "--- Local ~/.codemender Directory Contents ---"
          if [ -d ~/.codemender ]; then
            ls -la ~/.codemender
          else
            echo "[WARN] ~/.codemender directory does not exist!"
          fi

          if [ -n "$CLEAN_BUCKET" ] && [ "$CLEAN_BUCKET" != "true" ] && [ "$CLEAN_BUCKET" != "false" ]; then
            echo "=== Uploading state & artifacts to gs://${CLEAN_BUCKET} ==="

            if [ -d ~/.codemender ]; then
              echo "--> Creating and uploading state.tar.gz..."
              tar -czf /tmp/state.tar.gz -C ~ .codemender
              gcloud storage cp /tmp/state.tar.gz "gs://${CLEAN_BUCKET}/${GCS_TARGET_DIR}/state.tar.gz" || echo "[ERROR] Failed uploading state.tar.gz to ${GCS_TARGET_DIR}"
              gcloud storage cp /tmp/state.tar.gz "gs://${CLEAN_BUCKET}/state.tar.gz" || echo "[ERROR] Failed uploading state.tar.gz to bucket root"
            fi

            if [ -f ~/.codemender/state.db ]; then
              echo "--> Uploading state.db..."
              gcloud storage cp ~/.codemender/state.db "gs://${CLEAN_BUCKET}/${GCS_TARGET_DIR}/state.db" || echo "[ERROR] Failed uploading state.db to ${GCS_TARGET_DIR}"
              gcloud storage cp ~/.codemender/state.db "gs://${CLEAN_BUCKET}/state.db" || echo "[ERROR] Failed uploading state.db to bucket root"
            else
              echo "[INFO] ~/.codemender/state.db not found (no scan findings persisted)."
            fi

            if [ -f ~/.codemender/config.yaml ]; then
              echo "--> Uploading config.yaml..."
              gcloud storage cp ~/.codemender/config.yaml "gs://${CLEAN_BUCKET}/${GCS_TARGET_DIR}/config.yaml" || true
              gcloud storage cp ~/.codemender/config.yaml "gs://${CLEAN_BUCKET}/config.yaml" || true
            fi
            if [ -f ~/.codemender/audit.log ]; then
              echo "--> Uploading audit.log..."
              gcloud storage cp ~/.codemender/audit.log "gs://${CLEAN_BUCKET}/${GCS_TARGET_DIR}/audit.log" || true
              gcloud storage cp ~/.codemender/audit.log "gs://${CLEAN_BUCKET}/audit.log" || true
            fi

            if [ -d ~/.codemender/logs ]; then
              echo "--> Uploading logs..."
              gcloud storage cp -r ~/.codemender/logs "gs://${CLEAN_BUCKET}/${GCS_TARGET_DIR}/logs/${{ github.run_id }}/" || true
              gcloud storage cp -r ~/.codemender/logs "gs://${CLEAN_BUCKET}/logs/${{ github.run_id }}/" || true
            fi

            if [ -d ~/.codemender/artifacts ]; then
              echo "--> Uploading artifacts..."
              gcloud storage cp -r ~/.codemender/artifacts "gs://${CLEAN_BUCKET}/${GCS_TARGET_DIR}/artifacts/${{ github.run_id }}/" || true
              gcloud storage cp -r ~/.codemender/artifacts "gs://${CLEAN_BUCKET}/artifacts/${{ github.run_id }}/" || true
            fi

            echo "[SUCCESS] GCS Backup process completed."
          else
            echo "[ERROR] GCS_BUCKET is empty or invalid ('$RAW_BUCKET')."
            echo "[ACTION REQUIRED] Set 'GCS_BUCKET_NAME' in GitHub Repository Variables (Settings -> Secrets and variables -> Actions -> Variables) or Repository Secrets."
          fi

  # ==========================================================================
  # Job 2: main 브랜치 재스캔 결과 취약점이 0건일 때만 Cloud Run에 자동 배포
  # ==========================================================================
  deploy-cloud-run:
    name: Auto-Deploy to Google Cloud Run
    runs-on: ubuntu-latest
    needs: codemender-analysis
    if: needs.codemender-analysis.outputs.post_merge_vuln_count == '0' && needs.codemender-analysis.outputs.deploy_ready == 'true'

    steps:
      - name: Checkout latest verified main branch
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest main commits
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          echo "=== Deploying Verified Commit on main ==="
          git log -n 3 --oneline

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          create_credentials_file: false
          export_environment_variables: false

      - name: Configure GCP Credentials & Project
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          mkdir -p ~/.config/gcloud
          echo "$GCP_SA_KEY" > /tmp/gcp_credentials.json
          chmod 600 /tmp/gcp_credentials.json
          gcloud auth activate-service-account --key-file=/tmp/gcp_credentials.json

          PROJECT_ID=$(python3 -c 'import json, os; print(json.loads(os.environ.get("GCP_SA_KEY", "{}")).get("project_id", ""))')
          if [ -z "$PROJECT_ID" ]; then
            PROJECT_ID="${DEFAULT_GCP_PROJECT}"
          fi
          echo "PROJECT_ID=${PROJECT_ID}" >> $GITHUB_ENV
          gcloud config set project "${PROJECT_ID}" || true

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy to Google Cloud Run
        run: |
          echo "=== Deploying ${CLOUD_RUN_SERVICE} to Cloud Run (Project: ${PROJECT_ID}, Region: ${CLOUD_RUN_REGION}) ==="
          gcloud run deploy "${CLOUD_RUN_SERVICE}" \
            --source . \
            --project "${PROJECT_ID}" \
            --region "${CLOUD_RUN_REGION}" \
            --no-iap \
            --allow-unauthenticated \
            --quiet

          SERVICE_URL=$(gcloud run services describe "${CLOUD_RUN_SERVICE}" \
            --project "${PROJECT_ID}" \
            --region "${CLOUD_RUN_REGION}" \
            --format="value(status.url)" || true)

          echo "=== Cloud Run Deployment Complete ==="
          echo "Service URL: ${SERVICE_URL}"

          {
            echo "### 🚀 Cloud Run Auto-Deployment Succeeded"
            echo "- **Service**: \`${CLOUD_RUN_SERVICE}\`"
            echo "- **Project**: \`${PROJECT_ID}\`"
            echo "- **Region**: \`${CLOUD_RUN_REGION}\`"
            echo "- **Post-Merge Re-Scan Vulnerabilities**: \`${{ needs.codemender-analysis.outputs.post_merge_vuln_count }}\`"
            echo "- **Auto-Merged Branches**: \`${{ needs.codemender-analysis.outputs.merged_branches || 'main (clean on initial scan)' }}\`"
            if [ -n "${SERVICE_URL}" ]; then
              echo "- **Service URL**: [${SERVICE_URL}](${SERVICE_URL})"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
